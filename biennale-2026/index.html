</main>

  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

  { land: "Haiti", titel: "Yelena’s Garden, 2025-2026", kuenstler: ["Enock Placide"], ort: "Stadt", adresse: "Palazzo Albrizzi-Capello, Cannaregio 4118", lat: 45.4425, lng: 12.336, a: true },

  // Noch aus der Vorschau (folgen vollständig mit Teil 2):
  { land: "Japan", titel: "", kuenstler: ["Ei Arakawa-Nash"], ort: "Giardini", adresse: "Giardini" },
  { land: "Korea", titel: "Liberation Space: Fortress/Nest", kuenstler: ["Goen Choi", "Hyeree Ro"], ort: "Giardini", adresse: "Giardini" },
  { land: "Philippinen", titel: "Sea of Love", kuenstler: ["Jon Cuyson"], ort: "Arsenale", adresse: "Arsenale" },
  { land: "Syrien", titel: "The Tower Tomb of Palmyra", kuenstler: [], ort: "Stadt", adresse: "Università Iuav, Cotonificio Veneziano, Dorsoduro 2196", lat: 45.43405, lng: 12.31890, a: true },
];

/* ===================== Zustand ===================== */
const KEY = "biennale2026:v1";
const COLORS = ["#C0563B", "#2B6CA3", "#5E8C31", "#8A4F7D"];
const DEFAULT_NAMES = ["Person 1", "Person 2", "Person 3", "Person 4"];
const ORTE = ["Alle", "Giardini", "Arsenale", "Stadt"];

PAVILIONS.forEach(p => {
  p.id = slug(p.land);
  // Eigene Koordinaten bei Giardini/Arsenale = eigener Marker (z. B. Armenien, Tesa 41)
  p.eigen = p.ort !== "Stadt" && p.lat != null;
  if (p.lat == null && p.ort === "Giardini") [p.lat, p.lng] = GIARDINI;
  if (p.lat == null && p.ort === "Arsenale") [p.lat, p.lng] = ARSENALE;
  p.weitere = p.weitere || 0;
  p.hay = norm([p.land, p.titel, p.kuenstler.join(" ")].join(" "));
});

function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function freshState() {
  return { names: DEFAULT_NAMES.slice(), active: 0, ratings: {}, visited: {}, ort: "Alle", status: "Alle", sort: "az", view: "list" };
}
function load() {
  const s = freshState();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return s;
    const d = JSON.parse(raw);
    if (Array.isArray(d.names) && d.names.length === 4) s.names = d.names.map(n => String(n ?? ""));
    if (d.ratings && typeof d.ratings === "object") s.ratings = d.ratings;
    if (d.visited && typeof d.visited === "object") s.visited = d.visited;
    if (Number.isInteger(d.active)) s.active = d.active;
    if (ORTE.includes(d.ort)) s.ort = d.ort;
    if (["Alle", "Offen", "Besucht"].includes(d.status)) s.status = d.status;
    if (["az", "best"].includes(d.sort)) s.sort = d.sort;
    if (["list", "map"].includes(d.view)) s.view = d.view;
  } catch (e) { /* leerer Zustand */ }
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* privat-Modus o. Ä. */ }
}

let state = load();
let openId = null;
let query = "";
fixActive();

function visiblePeople() { return state.names.map((n, i) => ({ i, name: n.trim(), color: COLORS[i] })).filter(p => p.name); }
function fixActive() {
  const v = visiblePeople();
  if (v.length && !v.some(p => p.i === state.active)) state.active = v[0].i;
}
function rating(pid, i) { return (state.ratings[pid] || {})[i] || null; }
function hasRating(r) { return r && (r.k || r.g || (r.n && r.n.trim())); }
function setRating(pid, i, patch) {
  const all = state.ratings[pid] = state.ratings[pid] || {};
  const r = Object.assign({ k: 0, g: 0, n: "" }, all[i], patch);
  if (!hasRating(r)) delete all[i]; else all[i] = r;
  if (!Object.keys(all).length) delete state.ratings[pid];
  save();
}
function average(pid) {
  const vals = [];
  visiblePeople().forEach(p => { const r = rating(pid, p.i); if (r) { if (r.k) vals.push(r.k); if (r.g) vals.push(r.g); } });
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}
function fmt(n) { return n.toFixed(1).replace(".", ","); }

function filtered() {
  const q = norm(query.trim());
  let list = PAVILIONS.filter(p =>
    (state.ort === "Alle" || p.ort === state.ort) &&
    (state.status === "Alle" || (state.status === "Besucht") === !!state.visited[p.id]) &&
    (!q || p.hay.includes(q)));
  list.sort((a, b) => a.land.localeCompare(b.land, "de"));
  if (state.sort === "best") {
    list.sort((a, b) => {
      const x = average(a.id), y = average(b.id);
      if (x === null && y === null) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      return y - x;
    });
  }
  return list;
}

/* ===================== Kopf ===================== */
const $ = id => document.getElementById(id);

function segment(el, options, current, onPick) {
  el.innerHTML = options.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === current}">${esc(l)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (b) onPick(b.dataset.v); };
}

function renderHeader() {
  const v = visiblePeople();
  $("people").innerHTML = `<span class="lbl">Es bewertet:</span>` +
    v.map(p => `<button type="button" class="chip" style="--c:${p.color}" data-i="${p.i}" aria-pressed="${p.i === state.active}"><span class="dot"></span>${esc(p.name)}</button>`).join("") +
    `<button type="button" class="chip icon" id="edit-names" aria-label="Namen ändern">✎ Namen</button>`;
  segment($("f-ort"), ORTE.map(o => [o, o]), state.ort, v => { state.ort = v; update(); });
  segment($("f-status"), [["Alle", "Alle"], ["Offen", "Offen"], ["Besucht", "Besucht"]], state.status, v => { state.status = v; update(); });
  segment($("f-sort"), [["az", "A–Z"], ["best", "Bestbewertet"]], state.sort, v => { state.sort = v; update(); });
  segment($("f-view"), [["list", "Liste"], ["map", "Karte"]], state.view, v => { state.view = v; update(); });
  const done = PAVILIONS.filter(p => state.visited[p.id]).length;
  $("count").innerHTML = `<b>${done}</b> von ${PAVILIONS.length} besucht`;
}
$("people").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "edit-names") return openNames();
  state.active = +b.dataset.i; save(); renderHeader(); renderList();
});

/* ===================== Liste ===================== */
function artistsShort(p) {
  const k = p.kuenstler;
  if (!k.length) return "";
  const extra = p.weitere + Math.max(0, k.length - 4);
  return k.slice(0, 4).join(", ") + (extra ? ` und ${extra} weitere` : "");
}
function scaleHtml(kind, val) {
  let h = "";
  for (let n = 1; n <= 5; n++) h += `<button type="button" data-k="${kind}" data-n="${n}" class="${val === n ? "on" : ""}" aria-pressed="${val === n}" aria-label="${n} von 5">${n}</button>`;
  return h;
}
function itemHtml(p) {
  const avg = average(p.id);
  const dots = visiblePeople().filter(x => hasRating(rating(p.id, x.i))).map(x => `<i style="--c:${x.color}" title="${esc(x.name)}"></i>`).join("");
  const open = p.id === openId;
  const vis = !!state.visited[p.id];
  let html = `<li class="p${open ? " open" : ""}" id="p-${p.id}" data-id="${p.id}">
    <button type="button" class="head" aria-expanded="${open}" aria-controls="b-${p.id}">
      <div class="main">
        <div class="land">${esc(p.land)}${vis ? `<span class="check" aria-label="besucht">✓</span>` : ""}</div>
        ${p.titel ? `<div class="title">${esc(p.titel)}</div>` : ""}
        <div class="meta">${esc(artistsShort(p) || "–")} · ${esc(p.ort)}</div>
      </div>
      <div class="side">
        <span class="avg${avg === null ? " none" : ""}" aria-label="${avg === null ? "noch keine Bewertung" : "Durchschnitt " + fmt(avg)}">${avg === null ? "–" : fmt(avg)}</span>
        <span class="dots">${dots}</span>
      </div>
    </button>`;
  if (open) {
    const me = visiblePeople().find(x => x.i === state.active);
    const r = (me && rating(p.id, me.i)) || { k: 0, g: 0, n: "" };
    const others = visiblePeople().filter(x => x.i !== state.active && hasRating(rating(p.id, x.i)));
    html += `<div class="body" id="b-${p.id}">
      <div class="facts">
        ${p.kuenstler.length ? `<div><span>Künstler:innen:</span> ${esc(artistsShort(p))}</div>` : ""}
        <div><span>Ort:</span> ${esc(p.ort)} · ${esc(p.adresse)}</div>
      </div>
      ${me ? `
      <div class="rate"><div class="rl">Kreativität <em>${esc(me.name)} · nochmal tippen = zurücksetzen</em></div><div class="scale">${scaleHtml("k", r.k)}</div></div>
      <div class="rate"><div class="rl">Gefallen</div><div class="scale">${scaleHtml("g", r.g)}</div></div>
      <label class="rl" for="n-${p.id}" style="font-size:.9rem">Notiz</label>
      <textarea id="n-${p.id}" data-note placeholder="Was ist euch aufgefallen?">${esc(r.n)}</textarea>` : `<p>Bitte zuerst unter „Namen“ eine Person eintragen.</p>`}
      <div class="actions">
        <button type="button" class="btn gold" data-visit aria-pressed="${vis}">${vis ? "✓ Besucht" : "Als besucht markieren"}</button>
      </div>
      ${others.length ? `<div class="others"><h3>Die anderen</h3>${others.map(o => {
        const x = rating(p.id, o.i);
        return `<div><span class="who" style="--c:${o.color}"><i></i>${esc(o.name)}</span> · Kreativität ${x.k || "–"} · Gefallen ${x.g || "–"}${x.n && x.n.trim() ? `<p>${esc(x.n)}</p>` : ""}</div>`;
      }).join("")}</div>` : ""}
    </div>`;
  }
  return html + "</li>";
}
function renderList() {
  const list = filtered();
  $("list").innerHTML = list.length ? list.map(itemHtml).join("") : `<li class="empty">Kein Pavillon passt zu Suche und Filtern.</li>`;
}
function renderItem(id) {
  const li = document.getElementById("p-" + id);
  const p = PAVILIONS.find(x => x.id === id);
  if (!li || !p) return renderList();
  const focusSel = document.activeElement && document.activeElement.closest("li") === li ? focusKey(document.activeElement) : null;
  li.outerHTML = itemHtml(p);
  if (focusSel) { const el = document.getElementById("p-" + id).querySelector(focusSel); if (el) el.focus(); }
}
function focusKey(el) {
  if (el.matches(".head")) return ".head";
  if (el.dataset.k) return `[data-k="${el.dataset.k}"][data-n="${el.dataset.n}"]`;
  if (el.hasAttribute("data-visit")) return "[data-visit]";
  return null;
}
$("list").addEventListener("click", e => {
  const li = e.target.closest("li.p"); if (!li) return;
  const id = li.dataset.id;
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("head")) {
    const prev = openId;
    openId = openId === id ? null : id;
    if (prev && prev !== id) renderItem(prev);
    renderItem(id);
    return;
  }
  if (b.dataset.k) {
    const cur = rating(id, state.active) || {};
    const n = +b.dataset.n;
    setRating(id, state.active, { [b.dataset.k]: cur[b.dataset.k] === n ? 0 : n });
    if (state.sort === "best") { renderList(); } else renderItem(id);
    return;
  }
  if (b.hasAttribute("data-visit")) {
    toggleVisited(id);
  }
});
$("list").addEventListener("input", e => {
  if (!e.target.matches("[data-note]")) return;
  const id = e.target.closest("li.p").dataset.id;
  setRating(id, state.active, { n: e.target.value });
  // nur Kopfzeile auffrischen, damit das Textfeld den Fokus behält
  const li = document.getElementById("p-" + id);
  const tmp = document.createElement("ul"); tmp.innerHTML = itemHtml(PAVILIONS.find(x => x.id === id));
  li.querySelector(".side").replaceWith(tmp.querySelector(".side"));
});
function toggleVisited(id) {
  if (state.visited[id]) delete state.visited[id]; else state.visited[id] = true;
  save();
  renderHeader();
  if (state.status !== "Alle") renderList(); else renderItem(id);
  if (map) renderMarkers();
}

/* ===================== Namen ===================== */
function openNames() {
  $("names-fields").innerHTML = state.names.map((n, i) =>
    `<label style="--c:${COLORS[i]}"><i></i><span class="sr">Person ${i + 1}</span><input name="n${i}" value="${esc(n)}" maxlength="20" placeholder="(ausgeblendet)" autocomplete="off"></label>`).join("");
  const d = $("names");
  if (typeof d.showModal === "function") d.showModal();
  else { // sehr alte Browser
    const res = state.names.map((n, i) => prompt(`Name Person ${i + 1} (leer = ausblenden)`, n));
    if (res.every(x => x !== null)) { state.names = res.map(x => x.trim()); afterNames(); }
  }
}
$("names").addEventListener("close", () => {
  if ($("names").returnValue !== "ok") return;
  const f = $("names-form");
  state.names = [0, 1, 2, 3].map(i => f.elements["n" + i].value.trim().slice(0, 20));
  afterNames();
});
function afterNames() { fixActive(); save(); update(); }

/* ===================== Karte ===================== */
let map = null, markerLayer = null, meMarker = null;
function groups() {
  const g = new Map();
  filtered().forEach(p => {
    if (p.lat == null) return;
    const key = (p.ort === "Stadt" || p.eigen) ? `${p.lat.toFixed(5)},${p.lng.toFixed(5)}` : p.ort;
    if (!g.has(key)) g.set(key, { name: (p.ort === "Stadt" || p.eigen) ? p.adresse : p.ort, lat: p.lat, lng: p.lng, items: [] });
    g.get(key).items.push(p);
  });
  return [...g.values()];
}
function initMap() {
  if (map || typeof L === "undefined") return;
  map = L.map("map", { zoomControl: true }).setView([45.4370, 12.3360], 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  map.on("popupopen", e => {
    e.popup.getElement().addEventListener("click", ev => {
      const b = ev.target.closest("button[data-rate]");
      if (b) { map.closePopup(); jumpTo(b.dataset.rate); }
    });
  });
}
function renderMarkers() {
  if (!map) return;
  markerLayer.clearLayers();
  const gs = groups();
  gs.forEach(g => {
    const done = g.items.every(p => state.visited[p.id]);
    const n = g.items.length;
    const icon = L.divIcon({
      className: "", iconSize: n > 1 ? [34, 34] : [26, 26],
      html: `<div class="mk${done ? " done" : ""}${n > 1 ? "" : " solo"}">${n > 1 ? n : (done ? "✓" : "1")}</div>`
    });
    const html = `<div class="pop"><h3>${esc(g.name)}</h3><ul>${g.items.map(p =>
      `<li><span>${state.visited[p.id] ? "<b>✓</b> " : ""}${esc(p.land)}</span><button type="button" data-rate="${p.id}">Bewerten</button></li>`).join("")}</ul></div>`;
    L.marker([g.lat, g.lng], { icon, title: `${g.name}: ${n} Pavillon${n > 1 ? "s" : ""}` }).bindPopup(html, { maxWidth: 300 }).addTo(markerLayer);
  });
  if (gs.length && !renderMarkers.fitted) {
    renderMarkers.fitted = true;
    map.fitBounds(L.latLngBounds(gs.map(g => [g.lat, g.lng])).pad(0.15), { maxZoom: 15 });
  }
}
function jumpTo(id) {
  state.view = "list"; openId = id; update();
  const li = document.getElementById("p-" + id);
  if (li) {
    const top = li.getBoundingClientRect().top + scrollY - $("hdr").offsetHeight - 4;
    scrollTo({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    li.querySelector(".head").focus({ preventScroll: true });
  }
}
$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) return toast("Standort wird nicht unterstützt");
  toast("Standort wird gesucht …");
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) meMarker.setLatLng(ll);
    else meMarker = L.marker(ll, { icon: L.divIcon({ className: "", iconSize: [16, 16], html: '<div class="me"></div>' }), title: "Mein Standort", keyboard: false }).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 16));
  }, () => toast("Standort nicht verfügbar"), { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
});

/* ===================== Export / Import ===================== */
$("export").addEventListener("click", () => {
  const data = { app: "biennale-2026", version: 1, exportiert: new Date().toISOString(), names: state.names, ratings: state.ratings, visited: state.visited };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `biennale-2026-bewertungen-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("import").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "biennale-2026" || typeof d.ratings !== "object") throw new Error("format");
    if (!confirm("Bewertungen zusammenführen? Bei gleicher Person und gleichem Pavillon gewinnt die importierte Datei.")) return;
    let n = 0;
    for (const [pid, per] of Object.entries(d.ratings || {})) {
      if (!PAVILIONS.some(p => p.id === pid) || !per || typeof per !== "object") continue;
      for (const [i, r] of Object.entries(per)) {
        if (!/^[0-3]$/.test(i) || !r) continue;
        const clean = { k: clamp(r.k), g: clamp(r.g), n: String(r.n || "").slice(0, 2000) };
        if (hasRating(clean)) { (state.ratings[pid] = state.ratings[pid] || {})[i] = clean; n++; }
      }
    }
    for (const [pid, v] of Object.entries(d.visited || {})) if (v && PAVILIONS.some(p => p.id === pid)) state.visited[pid] = true;
    if (Array.isArray(d.names) && d.names.length === 4) state.names = state.names.map((own, i) => own.trim() || String(d.names[i] || "").slice(0, 20));
    fixActive(); save(); update();
    toast(`${n} Bewertungen importiert`);
  } catch (err) { toast("Diese Datei konnte nicht gelesen werden"); }
});
function clamp(v) { v = Math.round(+v); return v >= 1 && v <= 5 ? v : 0; }

/* ===================== Allgemein ===================== */
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

$("q").addEventListener("input", e => { query = e.target.value; renderList(); if (map) renderMarkers(); });

function setHeaderHeight() { document.documentElement.style.setProperty("--hh", $("hdr").offsetHeight + "px"); }

function update() {
  save();
  renderHeader();
  const isMap = state.view === "map";
  $("listView").hidden = isMap;
  $("mapView").hidden = !isMap;
  $("foot").hidden = isMap;
  $("notice").hidden = isMap;
  if (isMap) {
    setHeaderHeight();
    if (typeof L === "undefined") { $("map").innerHTML = '<p class="empty">Die Karte konnte nicht geladen werden (keine Verbindung?).</p>'; return; }
    initMap(); map.invalidateSize(); renderMarkers();
  } else renderList();
}

if (!DATA_COMPLETE) $("notice").innerHTML = `<div class="notice">Vorschau: Die Pavillon-Liste ist noch unvollständig.</div>`;
addEventListener("resize", () => { if (state.view === "map") { setHeaderHeight(); if (map) map.invalidateSize(); } });
update();
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer onload="if(state.view==='map')update()"></script>
</body>
</html>
